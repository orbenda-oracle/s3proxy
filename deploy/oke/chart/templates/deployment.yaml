apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pca-s3proxy.fullname" . }}
  labels:
    {{- include "pca-s3proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "pca-s3proxy.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pca-s3proxy.selector" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ include "pca-s3proxy.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: users
              mountPath: /etc/pca-s3proxy/users
              readOnly: true
            - name: native
              mountPath: /etc/pca-s3proxy/native
              readOnly: true
            - name: tls
              mountPath: /etc/pca-s3proxy/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
              readOnly: false
      volumes:
        - name: users
          secret:
            secretName: {{ required "secrets.users is required" .Values.secrets.users }}
            defaultMode: 0440
        - name: native
          secret:
            secretName: {{ required "secrets.native is required" .Values.secrets.native }}
            defaultMode: 0440
        - name: tls
          secret:
            secretName: {{ required "secrets.tls is required" .Values.secrets.tls }}
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
