# Serve this listener behind a private TLS proxy, or configure S3Proxy's
# secure-endpoint/keystore. Never expose this HTTP listener directly.
s3proxy.endpoint=http://127.0.0.1:8080
s3proxy.authorization=aws-v4
# One protected properties file per S3 access key / native user binding.
# Replace both placeholders; these authenticate S3 clients to S3Proxy.
s3proxy.identity=REPLACE_WITH_S3_ACCESS_KEY
s3proxy.credential=REPLACE_WITH_S3_SECRET_KEY

jclouds.provider=oci-native
# Include the actual native API base path; /oci is common on PCA.
# Do not supply an OCI compat.objectstorage endpoint or an S3 endpoint.
jclouds.endpoint=https://objectstorage.pca.example/oci
# Must exactly match user= in the OCI profile; no shared-principal fallback.
s3proxy.oci.user-id=ocid1.user.REPLACE
# Set false to revoke this gateway key on the next request lookup.
s3proxy.oci.enabled=true
s3proxy.oci.namespace=REPLACE_WITH_NAMESPACE
s3proxy.oci.compartment=ocid1.compartment.REPLACE
s3proxy.oci.config-file=/run/secrets/oci/config
s3proxy.oci.profile=PCA
